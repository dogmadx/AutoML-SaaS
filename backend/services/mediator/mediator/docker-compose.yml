version: "3.9"

services:
  pg_db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_DB=${SECURITY_DB}
      - POSTGRES_USER=${PSQL_USER}
      - POSTGRES_PASSWORD=${PSQL_PASS}
    ports:
      - "5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: